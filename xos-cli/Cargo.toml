[package]
name = "xos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XOS command line client"

[[bin]]
name = "xos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
