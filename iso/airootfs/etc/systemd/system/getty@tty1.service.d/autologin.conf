# Log in as root on the first console.
#
# The live medium exists to run an installer. Asking for a password nobody has
# been given, before anything can be installed, would be a locked door with no
# key — which is what the medium did before this file: "Cannot open access to
# console, the root account is locked."
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear %I 38400 linux
