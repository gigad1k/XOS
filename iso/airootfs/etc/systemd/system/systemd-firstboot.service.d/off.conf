# Do not run Arch's first-boot setup on the install medium.
#
# Left alone, systemd-firstboot decides this is a machine's first boot and asks
# for a timezone, a locale and a root password before anything else can happen.
# Somebody who booted a stick to install XOS is then looking at an Arch setup
# wizard, and the installer they were told to type is three questions away.
#
# A condition that cannot be met, rather than a symlink to /dev/null: this
# repository is cloned onto filesystems that do not carry symlinks, and a mask
# that quietly failed to travel would put the wizard back.
[Unit]
ConditionPathExists=/etc/xos-never-firstboot
