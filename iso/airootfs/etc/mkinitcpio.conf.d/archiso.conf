# The hooks that let the initramfs find and mount the live filesystem.
#
# Without this file the initramfs is built with the stock hooks, which know
# nothing about archiso. The medium then boots as far as the kernel, fails to
# switch root, and drops to an emergency shell — which is exactly what it did
# before this file existed. The bootloader working tells you nothing about
# this; only booting the image does.
#
# No archiso_pxe_* hooks. XOS is installed from a USB stick onto a machine in
# front of you, and carrying the network-boot hooks would mean carrying nbd and
# the NFS tools on a medium that has to decompress into the RAM of an 8GB
# machine.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)

# The medium is downloaded once and booted many times, so size beats build time.
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
