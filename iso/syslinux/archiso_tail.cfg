LABEL existing
TEXT HELP
Boot whatever is already installed on this machine, and change nothing.
ENDTEXT
MENU LABEL Boot the system already on this machine
COM32 boot/syslinux/chain.c32
APPEND hd0

LABEL reboot
MENU LABEL Restart
COM32 boot/syslinux/reboot.c32

LABEL poweroff
MENU LABEL Shut down
COM32 boot/syslinux/poweroff.c32
