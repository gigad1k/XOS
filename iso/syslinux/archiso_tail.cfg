LABEL existing
TEXT HELP
Boot whatever is already installed on this machine, and change nothing.
ENDTEXT
MENU LABEL Boot the system already on this machine
COM32 chain.c32
APPEND hd0 0

LABEL memtest
TEXT HELP
Test this machine's memory. A decade-old machine that is unstable for no
visible reason very often has failing RAM, and it is worth an hour to know.
ENDTEXT
MENU LABEL Test the memory
LINUX /boot/memtest86+/memtest

LABEL reboot
MENU LABEL Restart
COM32 reboot.c32

LABEL poweroff
MENU LABEL Shut down
COM32 poweroff.c32
