# ISOLINUX starts here.
#
# Paths are bare filenames on purpose: ISOLINUX resolves them against its own
# directory on the medium, so a "boot/syslinux/" prefix would send it looking
# for boot/syslinux/boot/syslinux/ and it would stop at a bare boot: prompt.
#
# There is no network-boot branch. XOS is installed from a stick into a machine
# in front of you, and the whichsys.c32 dance that chooses between PXE and local
# booting is a moving part this medium does not need.
DEFAULT sys

LABEL sys
CONFIG archiso_sys.cfg
