INCLUDE boot/syslinux/archiso_head.cfg

LABEL arch
TEXT HELP
Install XOS. Partitions a disk you choose and puts XOS on it.
ENDTEXT
MENU LABEL Install XOS
LINUX boot/x86_64/vmlinuz-linux
INITRD boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL archnomodeset
TEXT HELP
The same, with kernel modesetting off. Use this one if the screen goes
black or scrambled with the entry above.
ENDTEXT
MENU LABEL Install XOS (basic graphics)
LINUX boot/x86_64/vmlinuz-linux
INITRD boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset

INCLUDE boot/syslinux/archiso_tail.cfg
