INCLUDE archiso_head.cfg

# Without these the menu appears and waits for a keypress that, on a machine
# left to install itself, never comes.
DEFAULT arch
TIMEOUT 150

LABEL arch
TEXT HELP
Install XOS. Partitions a disk you choose and puts XOS on it.
ENDTEXT
MENU LABEL Install XOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL archnomodeset
TEXT HELP
The same, with kernel modesetting off. Use this one if the screen goes
black or scrambled with the entry above.
ENDTEXT
MENU LABEL Install XOS (basic graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

LABEL archauto
TEXT HELP
ERASES THE LARGEST DISK IN THIS MACHINE and installs XOS on it without
asking anything else. It counts down for 20 seconds first, and Ctrl+C
stops it. Use the entry above if you want to choose the disk yourself.
ENDTEXT
MENU LABEL Install XOS automatically (erases the largest disk)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% xos.auto

INCLUDE archiso_tail.cfg
