# For a machine whose graphics the kernel cannot drive. This is the entry that
# turns a black screen into an install, so it is offered rather than buried.
title    Install XOS (basic graphics)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
