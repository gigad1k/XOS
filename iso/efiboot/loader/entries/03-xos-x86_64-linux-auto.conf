# Erases the largest disk without asking. Sorted last so it is never the one
# somebody lands on by pressing Enter, and named so the choice is informed.
title    Install XOS automatically (erases the largest disk)
sort-key 03
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% xos.auto
