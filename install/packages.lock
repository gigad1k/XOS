# Every package XOS installs, at the version it was tested against.
#
# The guardrail is that every package is pinned, and `pin_install` refuses
# anything that is not listed here. An install that silently picks up whatever
# happens to be current is an install that cannot be reproduced, and on this
# project the whole point is machines that keep working.
#
# Format: name=version, one per line. The version is what was verified, not a
# minimum. To move a package, change it here, reinstall, and say in the commit
# what you tested it on.
#
# A note on honesty: these versions were current for Arch at the time of
# writing. Arch moves, and by the time anyone reads this several will have moved
# with it. `pin_install` reports every package it could not get, and the install
# continues, so a stale lock file degrades the install rather than breaking it.

