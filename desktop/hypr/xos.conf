# XOS desktop rules.
#
# Instrumentation, not decoration: 3px radius, tight gaps, hairline borders in
# the line colour, and the active border in local green so the focused window
# says which tier you are talking to. No shadows, and motion only where it
# conveys a state change.

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.inactive_border = rgba(454340ff)   # --xos-line
    col.active_border   = rgba(7A9B6Eff)   # --xos-local
    resize_on_border = true
}

decoration {
    rounding = 3
    # No shadows anywhere. STYLE.md 1.4.
    drop_shadow = false
    blur { enabled = false }
}

animations {
    enabled = true
    # Motion only where it conveys a state change, and short enough not to be
    # something you wait for.
    bezier = xos, 0.2, 0.0, 0.0, 1.0
    animation = windows, 1, 3, xos
    animation = fade, 1, 3, xos
    animation = workspaces, 1, 3, xos
    animation = border, 1, 2, xos
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# The kill switch.
#
# Bound to the CLI, never to a running application, so it works when a UI is
# unresponsive. It talks to the daemon over the socket, and the daemon handles it
# on a fresh task that takes no lock a running completion could hold.
bind = CTRL ALT, Escape, exec, xos halt
bind = CTRL ALT SHIFT, Escape, exec, xos resume

# The command palette and Mission Control.
bind = SUPER, Space, exec, xos-palette
bind = SUPER, M, exec, foot -a mission-control xos mission

windowrulev2 = float, class:^(xos-panel)$
windowrulev2 = size 520 320, class:^(xos-panel)$
windowrulev2 = float, class:^(mission-control)$
windowrulev2 = size 1100 700, class:^(mission-control)$
